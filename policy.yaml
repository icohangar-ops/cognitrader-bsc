# ============================================================
# CogniTrader BSC — Decision Governance Policy (CHP gate)
# Ported from the CleanMandate / SwarmFi-Executor CHP pattern.
# Notional units are USD. If this file is missing or unparseable,
# the CHP gate falls back to a conservative built-in default and
# logs a warning (see src/chp/policy.ts).
# ============================================================
version: "1.0"

# Hard ceiling on a single trade's notional (USD). Above this the
# trade is BLOCKED outright regardless of human approval.
max_notional_usd: 5000.0

# Cumulative notional allowed per rolling day (USD).
daily_notional_cap_usd: 20000.0

# Human-in-the-loop threshold (USD). At or above this notional the
# trade requires explicit human approval before it can LOCK.
hitl_threshold_usd: 1000.0

# Actions the agent is permitted to take at all.
allowed_actions:
  - LONG
  - SHORT

# Per-asset notional caps (USD). Assets omitted here fall back to
# max_notional_usd. An asset mapped to 0 is effectively blocked.
per_asset_limits:
  CAKE: 2000.0
  ETH: 5000.0
  ADA: 1500.0
  SOL: 3000.0
  AVAX: 1500.0

# Minimum aggregated signal confidence (0..1) for a trade to pass
# the adversarial sanity check.
min_confidence: 0.5
